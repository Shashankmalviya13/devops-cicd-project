
name: AIOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DevOps project dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f aiops-platform/requirements.txt ]; then pip install -r aiops-platform/requirements.txt; fi

      - name: Run existing DevOps tests
        run: python -m unittest -v test_app.py

      - name: Check AIOps Python syntax
        run: python -m compileall -q aiops-platform/app

      - name: Build AIOps Docker image
        run: docker build -t aiops-platform:ci ./aiops-platform
